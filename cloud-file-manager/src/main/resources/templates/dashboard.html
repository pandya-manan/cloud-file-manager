<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud File Manager</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-slate-900 text-white px-8 py-5 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                Cloud File Manager
            </h1>

            <span class="text-sm text-slate-300">
                Powered by Amazon S3
            </span>

        </div>
		<form th:action="@{/logout}" method="post">
		    <input type="hidden"
		           th:name="${_csrf.parameterName}"
		           th:value="${_csrf.token}">

		    <button type="submit"
		            class="bg-red-600 text-white px-4 py-2 rounded-lg">
		        Logout
		    </button>
		</form>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">

        <!-- Heading -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-slate-800">
                My Files
            </h2>

            <p class="text-slate-500 mt-2">
                Manage your cloud files in one place.
            </p>
        </div>

        <!-- Success Message -->
        <div th:if="${successMessage}"
             class="mb-6 p-4 rounded-lg bg-green-100 text-green-800"
             th:text="${successMessage}">
        </div>
		
		<!-- Error Message -->
		<div th:if="${errorMessage}"
		     class="mb-4 rounded-lg border border-red-200 bg-red-50 p-4 text-red-700"
		     role="alert">
		    <span th:text="${errorMessage}"></span>
		</div>

        <!-- Upload Section -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8">

            <h3 class="text-xl font-semibold text-slate-800 mb-4">
                Upload a File
            </h3>

            <form th:action="@{/files/upload}"
                  method="post"
                  enctype="multipart/form-data"
                  class="flex flex-col md:flex-row gap-4">

                <input type="file"
                       name="file"
                       required
                       class="flex-1 border border-slate-300 rounded-lg p-3">

                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-medium">
                    Upload File
                </button>

            </form>

            <p class="text-xs text-slate-500 mt-3">
                Maximum upload size: 10 MB
            </p>

        </div>

        <!-- Search Section -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8">

            <form th:action="@{/}" method="get"
                  class="flex flex-col md:flex-row gap-3">

                <input type="text"
                       name="name"
                       th:value="${searchName}"
                       placeholder="Search files by name..."
                       class="flex-1 border border-slate-300 rounded-lg p-3">

                <button type="submit"
                        class="bg-slate-800 hover:bg-slate-900 text-white px-8 py-3 rounded-lg">
                    Search
                </button>

                <a th:href="@{/}"
                   class="text-center border border-slate-300 px-8 py-3 rounded-lg">
                    Clear
                </a>

            </form>

        </div>

        <!-- File Listing -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">

            <div class="p-6 border-b border-slate-200 flex justify-between">
                <h3 class="text-xl font-semibold text-slate-800">
                    Uploaded Files
                </h3>

                <span class="text-sm text-slate-500"
                      th:text="${files.totalElements} + ' files'">
                </span>
            </div>

            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead class="bg-slate-50 text-slate-600 text-sm">
                        <tr>
                            <th class="p-4">File Name</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Size</th>
                            <th class="p-4">Uploaded At</th>
                            <th class="p-4">Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="file : ${files.content}"
                            class="border-t border-slate-100 hover:bg-slate-50">

                            <td class="p-4 font-medium text-slate-800"
                                th:text="${file.originalFileName}">
                            </td>

                            <td class="p-4 text-sm text-slate-500"
                                th:text="${file.contentType}">
                            </td>

                            <td class="p-4 text-sm text-slate-500"
                                th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 2)} + ' KB'">
                            </td>

                            <td class="p-4 text-sm text-slate-500"
                                th:text="${#temporals.format(file.uploadedAt, 'dd-MM-yyyy HH:mm')}">
                            </td>

                            <td class="p-4">

                                <div class="flex gap-3">

                                    <a th:href="@{/api/files/{id}/download(id=${file.id})}"
                                       class="text-blue-600 hover:text-blue-800 font-medium">
                                        Download
                                    </a>

                                    <a th:href="@{/api/files/{id}/presigned-url(id=${file.id})}"
                                       target="_blank"
                                       class="text-green-600 hover:text-green-800 font-medium">
                                        Share URL
                                    </a>

                                    <form th:action="@{/files/{id}/delete(id=${file.id})}"
                                          method="post"
                                          onsubmit="return confirm('Are you sure you want to delete this file?');">

                                        <button type="submit"
                                                class="text-red-600 hover:text-red-800 font-medium">
                                            Delete
                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        <tr th:if="${files.empty}">
                            <td colspan="5"
                                class="p-10 text-center text-slate-500">
                                No files found. Upload your first file!
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <!-- Pagination -->
            <div class="p-5 border-t border-slate-200 flex justify-between items-center">

                <span class="text-sm text-slate-500">
                    Page
                    <span th:text="${files.number + 1}"></span>
                    of
                    <span th:text="${files.totalPages == 0 ? 1 : files.totalPages}"></span>
                </span>

                <div class="flex gap-3">

                    <a th:if="${files.hasPrevious()}"
                       th:href="@{/(page=${files.number - 1}, name=${searchName})}"
                       class="px-4 py-2 border rounded-lg hover:bg-slate-100">
                        Previous
                    </a>

                    <a th:if="${files.hasNext()}"
                       th:href="@{/(page=${files.number + 1}, name=${searchName})}"
                       class="px-4 py-2 border rounded-lg hover:bg-slate-100">
                        Next
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
