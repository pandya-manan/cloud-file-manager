
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloud File Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

    <h1 class="text-2xl font-bold text-center mb-2">
        Welcome back
    </h1>

    <p class="text-gray-500 text-center mb-6">
        Log in to your Cloud File Manager
    </p>

    <div th:if="${param.error}"
         class="bg-red-100 text-red-700 p-3 rounded mb-4">
        Invalid email or password.
    </div>

    <div th:if="${param.logout}"
         class="bg-green-100 text-green-700 p-3 rounded mb-4">
        You have logged out successfully.
    </div>

    <div th:if="${successMessage}"
         class="bg-green-100 text-green-700 p-3 rounded mb-4"
         th:text="${successMessage}">
    </div>

    <form th:action="@{/login}"
          method="post"
          class="space-y-4">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div>
            <label class="block mb-1 font-medium">Email</label>
            <input type="email"
                   name="username"
                   required
                   class="w-full border rounded-lg p-3"
                   placeholder="you@example.com">
        </div>

        <div>
            <label class="block mb-1 font-medium">Password</label>
            <input type="password"
                   name="password"
                   required
                   class="w-full border rounded-lg p-3"
                   placeholder="Your password">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white rounded-lg p-3
                       hover:bg-blue-700 font-semibold">
            Log in
        </button>

    </form>

    <p class="text-center text-sm mt-6">
        Don't have an account?
        <a th:href="@{/signup}"
           class="text-blue-600 font-semibold">
            Sign up
        </a>
    </p>

</div>
</body>
</html>
