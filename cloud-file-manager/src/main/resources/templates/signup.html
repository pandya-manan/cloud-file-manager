
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cloud File Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

    <h1 class="text-2xl font-bold text-center mb-2">
        Create your account
    </h1>

    <p class="text-gray-500 text-center mb-6">
        Start managing your files securely
    </p>

    <form th:action="@{/signup}"
          th:object="${signupRequest}"
          method="post"
          class="space-y-4">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div th:if="${#fields.hasGlobalErrors()}"
             class="text-red-600 text-sm">
            <p th:each="error : ${#fields.globalErrors()}"
               th:text="${error}"></p>
        </div>

        <div>
            <label class="block mb-1 font-medium">Full name</label>
            <input type="text"
                   th:field="*{fullName}"
                   class="w-full border rounded-lg p-3"
                   placeholder="Your full name">
            <p class="text-red-600 text-sm"
               th:errors="*{fullName}"></p>
        </div>

        <div>
            <label class="block mb-1 font-medium">Email</label>
            <input type="email"
                   th:field="*{email}"
                   class="w-full border rounded-lg p-3"
                   placeholder="you@example.com">
            <p class="text-red-600 text-sm"
               th:errors="*{email}"></p>
        </div>

        <div>
            <label class="block mb-1 font-medium">Password</label>
            <input type="password"
                   th:field="*{password}"
                   class="w-full border rounded-lg p-3"
                   placeholder="At least 8 characters">
            <p class="text-red-600 text-sm"
               th:errors="*{password}"></p>
        </div>

        <div>
            <label class="block mb-1 font-medium">
                Confirm password
            </label>
            <input type="password"
                   th:field="*{confirmPassword}"
                   class="w-full border rounded-lg p-3"
                   placeholder="Confirm your password">
            <p class="text-red-600 text-sm"
               th:errors="*{confirmPassword}"></p>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white rounded-lg p-3
                       hover:bg-blue-700 font-semibold">
            Create account
        </button>

    </form>

    <p class="text-center text-sm mt-6">
        Already have an account?
        <a th:href="@{/login}"
           class="text-blue-600 font-semibold">
            Log in
        </a>
    </p>

</div>
</body>
</html>
