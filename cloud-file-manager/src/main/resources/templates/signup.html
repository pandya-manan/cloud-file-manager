
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Cloud File Manager</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
        }

        .form-input {
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
    </style>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-5">

    <div class="w-full max-w-md py-6">

        <!-- Branding -->
        <div class="text-center mb-7">

            <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl font-bold shadow-lg shadow-blue-200 mb-4">
                C
            </div>

            <h1 class="text-2xl font-bold text-slate-900">
                Cloud File Manager
            </h1>

            <p class="text-sm text-slate-500 mt-2">
                Secure cloud storage powered by Amazon S3
            </p>

        </div>


        <!-- Signup Card -->
        <div class="auth-card rounded-2xl border border-slate-200 shadow-xl shadow-slate-200/60 p-7 sm:p-9">

            <div class="mb-7">

                <h2 class="text-2xl font-bold text-slate-900">
                    Create your account
                </h2>

                <p class="text-sm text-slate-500 mt-2">
                    Start managing your files securely in the cloud.
                </p>

            </div>


            <!-- Signup Form -->
            <form th:action="@{/signup}"
                  th:object="${signupRequest}"
                  method="post"
                  class="space-y-4">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <!-- Global Errors -->
                <div th:if="${#fields.hasGlobalErrors()}"
                     class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-sm">

                    <p th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                    </p>

                </div>


                <!-- Full Name -->
                <div>

                    <label for="fullName"
                           class="block text-sm font-semibold text-slate-700 mb-2">
                        Full Name
                    </label>

                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           autocomplete="name"
                           class="form-input w-full border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 text-sm"
                           placeholder="Your full name">

                    <p class="text-red-600 text-xs mt-1"
                       th:errors="*{fullName}">
                    </p>

                </div>


                <!-- Email -->
                <div>

                    <label for="email"
                           class="block text-sm font-semibold text-slate-700 mb-2">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           autocomplete="email"
                           class="form-input w-full border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 text-sm"
                           placeholder="you@example.com">

                    <p class="text-red-600 text-xs mt-1"
                       th:errors="*{email}">
                    </p>

                </div>


                <!-- Password -->
                <div>

                    <label for="signupPassword"
                           class="block text-sm font-semibold text-slate-700 mb-2">
                        Password
                    </label>

                    <div class="relative">

                        <input type="password"
                               id="signupPassword"
                               th:field="*{password}"
                               autocomplete="new-password"
                               class="form-input w-full border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 pr-16 text-sm"
                               placeholder="At least 8 characters">

                        <button type="button"
                                onclick="togglePassword('signupPassword', this)"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-blue-600 hover:text-blue-800">
                            Show
                        </button>

                    </div>

                    <p class="text-red-600 text-xs mt-1"
                       th:errors="*{password}">
                    </p>

                </div>


                <!-- Confirm Password -->
                <div>

                    <label for="confirmPassword"
                           class="block text-sm font-semibold text-slate-700 mb-2">
                        Confirm Password
                    </label>

                    <div class="relative">

                        <input type="password"
                               id="confirmPassword"
                               th:field="*{confirmPassword}"
                               autocomplete="new-password"
                               class="form-input w-full border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 pr-16 text-sm"
                               placeholder="Confirm your password">

                        <button type="button"
                                onclick="togglePassword('confirmPassword', this)"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-blue-600 hover:text-blue-800">
                            Show
                        </button>

                    </div>

                    <p class="text-red-600 text-xs mt-1"
                       th:errors="*{confirmPassword}">
                    </p>

                </div>


                <!-- Submit -->
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-3.5 font-semibold shadow-lg shadow-blue-200 transition duration-200 mt-3">
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <div class="border-t border-slate-100 mt-7 pt-6 text-center">

                <p class="text-sm text-slate-500">
                    Already have an account?

                    <a th:href="@{/login}"
                       class="text-blue-600 hover:text-blue-800 font-semibold ml-1">
                        Log in
                    </a>
                </p>

            </div>

        </div>


        <p class="text-center text-xs text-slate-400 mt-7">
            Cloud File Manager · Secure file management
        </p>

    </div>


    <!-- Password Toggle -->
    <script>
        function togglePassword(inputId, button) {

            const passwordInput = document.getElementById(inputId);

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                button.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>
</html>
