
# Application
spring.application.name=cloud-file-manager
server.port=${SERVER_PORT:8007}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloud_file_manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Session Configuration
server.servlet.session.tracking-modes=cookie

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# AWS Configuration
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:demo-practice-bucket-962698760489-ap-southeast-1-an}

# Local development environment variables
spring.config.import=optional:file:.env[.properties]

# Admin Account Details
app.admin.full-name=${ADMIN_FULL_NAME:Cloud File Manager Admin}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
